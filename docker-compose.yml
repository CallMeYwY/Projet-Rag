name: rag-documentaire

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    # Sans clé, on laisse Qdrant appliquer son réglage local par défaut.
    command:
      - sh
      - -ec
      - |
        if [ -n "$$QDRANT_API_KEY" ]; then export QDRANT__SERVICE__API_KEY="$$QDRANT_API_KEY"; fi
        exec ./entrypoint.sh
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD", "bash", "-ec", ": > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      COLLECTION: ${COLLECTION:-documents_v2}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      TIMEOUT: ${TIMEOUT:-120}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      MAX_CHUNKS: ${MAX_CHUNKS:-2048}
      MAX_TOP_K: ${MAX_TOP_K:-30}
      SCORE_THRESHOLD: ${SCORE_THRESHOLD:-}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-6000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-250000}
      MAX_PAGES: ${MAX_PAGES:-100}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-fra+eng}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Le profil évite de télécharger les modèles une deuxième fois si Ollama tourne déjà sur l'hôte.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_models:
